services:
  # =========================
  # 1. POSTGRES (Dùng chung cho cả Airflow & Warehouse)
  # =========================
  postgres:
    image: postgres:15
    container_name: postgres-db
    ports:
      - "5432:5432"
    networks:
      - airflow_net
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d # Vẫn giữ init script của bạn
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U airflow" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================
  # 2. AIRFLOW INIT
  # =========================
  airflow-init:
    image: airflow-custom:latest
    build:
      context: airflow
      dockerfile: Dockerfile.airflow
    container_name: airflow-init
    env_file: [ .env ]
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      - airflow_net
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    entrypoint:
      - bash
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --password admin --firstname Admin --lastname Admin --role Admin --email admin@example.com || true

  # =========================
  # 3. AIRFLOW WEBSERVER
  # =========================
  airflow-webserver:
    image: airflow-custom:latest
    container_name: airflow-webserver
    command: airflow webserver
    ports:
      - "8080:8080"
    env_file: [ .env ]
    depends_on:
      - airflow-init
    networks:
      - airflow_net
    volumes:
      - ./airflow:/opt/airflow
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./spark/jars:/opt/spark/custom_jars
    environment: &airflow-common-env
      AIRFLOW_CONN_POSTGRES_DEFAULT: 'postgresql://airflow:airflow@postgres-db:5432/weather_dw'
      AIRFLOW__CORE__TEST_CONNECTION: "Enabled"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_CORE_FERNET_KEY}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      # Thêm cấu hình Email của bạn tại đây
      AIRFLOW__SMTP__SMTP_HOST: ${AIRFLOW__SMTP__SMTP_HOST}
      AIRFLOW__SMTP__SMTP_STARTTLS: "True"
      AIRFLOW__SMTP__SMTP_USER: ${AIRFLOW__SMTP__SMTP_USER}
      AIRFLOW__SMTP__SMTP_PASSWORD: ${AIRFLOW__SMTP__SMTP_PASSWORD}
      AIRFLOW__SMTP__SMTP_PORT: ${AIRFLOW__SMTP__SMTP_PORT}

  # =========================
  # 4. AIRFLOW SCHEDULER (Chạy task trực tiếp ở đây)
  # =========================
  airflow-scheduler:
    image: airflow-custom:latest
    container_name: airflow-scheduler
    command: airflow scheduler
    env_file: [ .env ]
    depends_on:
      - airflow-init
    networks:
      - airflow_net
    volumes:
      - ./airflow:/opt/airflow
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./spark/jars:/opt/spark/custom_jars
    environment: *airflow-common-env

  # =========================
  # 5. SPARK MASTER
  # =========================
  spark-master:
    image: spark-custom:latest
    build:
      context: spark
      dockerfile: Dockerfile.spark
    container_name: spark-master
    hostname: spark-master
    ports:
      - "8081:8081"
      - "7077:7077"
    networks:
      - airflow_net
    environment:
      SPARK_MASTER_WEBUI_PORT: 8081
    volumes:
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./spark/jars:/opt/spark/custom_jars
    env_file: .env
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master

  # =========================
  # 6. SPARK WORKER (Chỉ dùng 1 cái để tiết kiệm RAM)
  # =========================
  spark-worker:
    image: spark-custom:latest
    container_name: spark-worker
    depends_on: [ spark-master ]
    networks:
      - airflow_net
    volumes:
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./spark/jars:/opt/spark/custom_jars
    env_file: .env # Giới hạn Core và RAM để máy không bị treo
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --cores 1 --memory 1g

  # =========================
  # 7. FASTAPI SERVICE
  # =========================
  api:
    build:
      context: api
    container_name: weather-api
    ports:
      - "8000:8000"
    networks:
      - airflow_net
    volumes:
      - ./api:/app
    environment:
      DATABASE_URL: postgresql://airflow:airflow@postgres:5432/weather_dw
    depends_on:
      postgres:
        condition: service_healthy
    command: [ "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload" ]

volumes:
  airflow_postgres_data:


networks:
  airflow_net:
    driver: bridge
