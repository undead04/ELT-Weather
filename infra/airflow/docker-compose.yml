services:
  # =========================
  # 2. AIRFLOW INIT
  # =========================
  airflow-init:
    build:
      context: ../../airflow
      dockerfile: Dockerfile.airflow
    image: airflow-custom:latest
    container_name: airflow-init
    env_file: .env
    networks:
      - weather_data
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow_user:airflow@postgres:5432/airflow
      DBT_PROFILES_DIR: /opt/dbt
    volumes:
      - ../../dbt:/opt/dbt
    entrypoint:
      - bash
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --password admin --firstname Admin --lastname Admin --role Admin --email admin@example.com || true
        # Initialize dimensions with data
        dbt run --select tag:static_dim --profiles-dir /opt/dbt --project-dir /opt/dbt

  # =========================
  # 3. AIRFLOW WEBSERVER
  # =========================
  airflow-webserver:
    image: airflow-custom:latest
    container_name: airflow-webserver
    command: airflow webserver
    ports:
      - "8080:8080"
    env_file: .env

    depends_on:
      - airflow-init
    networks:
      - weather_data
    volumes:
      - ../../airflow:/opt/airflow
      - ../../dbt:/opt/dbt/

    environment: &airflow-common-env
      AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: 600
      AIRFLOW_CONN_POSTGRES_DEFAULT: "postgresql://postgres:postgres@postgres:5432/weather_dw"
      AIRFLOW__CORE__TEST_CONNECTION: "Enabled"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_CORE_FERNET_KEY}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow_user:airflow@postgres:5432/airflow
      # Thêm cấu hình Email của bạn tại đây
      AIRFLOW__SMTP__SMTP_HOST: ${AIRFLOW__SMTP__SMTP_HOST}
      AIRFLOW__SMTP__SMTP_STARTTLS: "True"
      AIRFLOW__SMTP__SMTP_USER: ${AIRFLOW__SMTP__SMTP_USER}
      AIRFLOW__SMTP__SMTP_PASSWORD: ${AIRFLOW__SMTP__SMTP_PASSWORD}
      AIRFLOW__SMTP__SMTP_PORT: ${AIRFLOW__SMTP__SMTP_PORT}
      _PIP_ADDITIONAL_REQUIREMENTS: "dbt-postgres"

  # =========================
  # 4. AIRFLOW SCHEDULER (Chạy task trực tiếp ở đây)
  # =========================
  airflow-scheduler:
    image: airflow-custom:latest
    container_name: airflow-scheduler
    command: airflow scheduler
    env_file: .env
    depends_on:
      - airflow-init
    networks:
      - weather_data
    volumes:
      - ../../airflow:/opt/airflow
      - ../../dbt:/opt/dbt

    environment: *airflow-common-env

networks:
  weather_data:
    external: true
